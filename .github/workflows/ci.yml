name: CI

# Every gate, and the e2e tests against Obsidian for Linux (D-227). The iPhone
# and memory tests run locally.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Type-check the e2e specs
              run: pnpm run typecheck:e2e

            - name: Run the unit tests
              run: pnpm run test:coverage

            - name: Build the plugin
              run: pnpm run build

    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/e2e-setup

            - name: Run the e2e tests
              run: xvfb-run -a -s "-screen 0 1920x1080x24" pnpm run test:e2e

            # A test may retry where it fails now and then (docs/TODO.md).
            - name: Warn of each test that passed only on a retry
              id: flaky
              run: node scripts/flaky-tests.mjs

            - name: Keep the report and traces of a failed or flaky run
              if: failure() || steps.flaky.outputs.found == 'true'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-results
                  path: test-results/
                  retention-days: 14
