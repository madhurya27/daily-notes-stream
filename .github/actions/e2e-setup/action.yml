name: Set up the e2e tests
description: Installs the dependencies, and Obsidian for Linux pinned by version and
    SHA-256, for `pnpm run test:e2e` (D-227). Check out the repo first.

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

        - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version: 26
              cache: pnpm

        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile

        - name: Install Obsidian
          shell: bash
          env:
              OBSIDIAN_VERSION: 1.15.0
          run: |
              OBSIDIAN_PATH="$GITHUB_WORKSPACE/.dev/obsidian/obsidian"
              curl -fsSL -o "$RUNNER_TEMP/obsidian.tar.gz" "https://github.com/obsidianmd/obsidian-releases/releases/download/v$OBSIDIAN_VERSION/obsidian-$OBSIDIAN_VERSION.tar.gz"
              echo "75594ae09914ca0191dde13c0697dee653322287a3a806c15519332d9ada14d3  $RUNNER_TEMP/obsidian.tar.gz" | sha256sum -c
              mkdir -p "$(dirname "$OBSIDIAN_PATH")"
              tar -xzf "$RUNNER_TEMP/obsidian.tar.gz" -C "$(dirname "$OBSIDIAN_PATH")" --strip-components=1
              echo "OBSIDIAN_PATH=$OBSIDIAN_PATH" >> "$GITHUB_ENV"

        - name: Install the libraries Electron needs
          shell: bash
          run: pnpm exec playwright install-deps chromium

        # Ubuntu blocks the user namespaces that Chromium's sandbox needs.
        - name: Let Obsidian keep its sandbox on
          shell: bash
          run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
