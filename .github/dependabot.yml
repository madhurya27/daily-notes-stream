# Moves the versions the weekly pin check does not: the actions every workflow
# pins by commit, and the obsidian package's API types (D-240). Each pull
# request runs CI.
version: 2
updates:
    - package-ecosystem: github-actions
      directories:
          - /
          - /.github/actions/e2e-setup
      schedule:
          interval: weekly
          day: monday
      commit-message:
          prefix: ci
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      allow:
          - dependency-name: obsidian
      commit-message:
          prefix: build
